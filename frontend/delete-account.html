<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Questrial&display=swap"
      rel="stylesheet"
    />
    <title>Gérer mon compte</title>
  </head>

  <body class="antialiased font-['Questrial',sans-serif] bg-white min-h-screen">
    <!-- HEADER -->
    <header
      class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md border-b border-white/10 px-6 py-4"
    >
      <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center">
          <!-- Logo + Bouton menu mobile -->
          <div class="flex items-center gap-4">
            <!-- Bouton menu visible seulement sur mobile -->
            <button id="menu-btn" class="md:hidden text-[#E2F167] text-2xl">
              <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Logo du site -->
            <a
              href="#"
              class="text-2xl font-bold tracking-tighter text-[#E2F167]"
              >CONNECT'IN</a
            >
          </div>

          <!-- Barre de recherche (visible sur desktop uniquement) -->
          <!-- <div class="relative w-1/3 hidden md:block">
            <i
              class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/40"
            ></i>
            <input
              type="text"
              placeholder="Rechercher un post..."
              class="w-full bg-white/5 border border-white/10 rounded-full text-white py-2 pl-12 pr-4 focus:outline-none focus:border-[#E2F167] transition"
            />
          </div> -->

          <!-- Profil utilisateur + bouton recherche mobile -->
          <div class="flex items-center gap-4">
            <!-- <button
              id="search-trigger"
              class="md:hidden text-white/60 text-xl p-2"
            >
              <i class="fa-solid fa-magnifying-glass"></i>
            </button> -->

            <!-- Initiales utilisateur -->
            <a
              href="#"
              class="w-10 h-10 rounded-full bg-[#E2F167] text-slate-900 flex items-center justify-center font-bold"
            >
              JD</a
            >
          </div>
        </div>

        <!-- Barre de recherche mobile (cachée par défaut) -->
        <!-- <div
          id="mobile-search-bar"
          class="hidden md:hidden mt-4 relative animate-fadeIn"
        >
          <i
            class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/40"
          ></i>
          <input
            type="text"
            placeholder="Rechercher un post..."
            class="w-full bg-white/5 border border-white/10 rounded-full text-white py-4 pl-12 pr-4 focus:outline-none focus:border-[#E2F167] transition text-sm"
          />
        </div> -->
      </div>
    </header>

    <div class="max-w-7xl mx-auto flex px-6 gap-8 relative">
      <!-- SIDEBAR (MENU LATÉRAL)  -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-60 w-74 bg-white md:bg-transparent border-r md:border-none border-gray-100 p-6 md:p-0 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col gap-6 md:top-10 h-full md:h-fit"
      >
        <!-- En-tête du menu mobile -->
        <div class="flex justify-between items-center mb-4 md:hidden">
          <span class="font-bold text-xl text-black">Menu</span>
          <button id="close-btn" class="text-2xl text-black">&times;</button>
        </div>

        <!-- Premier bloc de navigation -->
        <div class="bg-white md:bg-white/5 rounded-3xl p-4 flex flex-col gap-1">
          <!-- Liens principaux -->
          <a
            href="accueil.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium"
          >
            <i class="fa-solid fa-house w-6"></i> Accueil
          </a>
          <a
            href="profil.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-user w-6"></i> Profil
          </a>
          <!-- <a
            href="#"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-bell w-6"></i> Notifications
          </a> -->
          <a
            href="delete-account.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-gear w-6"></i> Gérer mon compte
          </a>

          <!-- Bouton pour poster -->
          <a
            href="#"
            class="mt-4 bg-black text-white text-center font-bold py-3 rounded-xl hover:scale-105 transition-all"
            >Poster</a
          >
        </div>

        <!-- Second bloc de navigation -->
        <div class="bg-white md:bg-white/5 rounded-3xl p-4 flex flex-col gap-1">
          <!-- Liens principaux -->
          <a
            href="apropos.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-circle-info w-6"></i> À propos
          </a>
          <a
            href="contact.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-envelope w-6"></i> Contact
          </a>
          <a
            href="aide.html"
            class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 transition font-medium"
          >
            <i class="fa-solid fa-circle-question w-6"></i> Aide
          </a>

          <!-- Bouton de déconnexion -->
          <a
            href="index.html"
            class="mt-4 text-black flex items-center justify-center gap-2 rounded-xl border hover:border-red-600 hover:text-red-600 py-3 font-bold transition"
          >
            <i class="fa-solid fa-power-off"></i> Déconnexion
          </a>
        </div>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 bg-black/50 z-55 hidden md:hidden"
      ></div>

      <div class="flex flex-col gap-6 flex-1 w-full max-w-2xl mx-auto mt-10">
        <!--Section "Modifier mon adresse email"  -->

        <section class="flex-1 w-full max-w-2xl mx-auto mt-10">
          <div
            class="bg-white rounded-3xl shadow-lg border border-gray-100 p-6 md:p-10"
          >
            <div class="flex items-center gap-4 mb-8">
              <h2
                class="text-xl md:text-2xl font-bold uppercase tracking-widest text-black"
              >
                Modifier mon email
              </h2>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <form id="email-form" class="flex flex-col gap-4">
              <input
                type="email"
                id="new-email"
                placeholder="Nouvelle adresse email"
                class="border border-gray-300 rounded-xl px-4 py-3 text-black focus:outline-none focus:border-black"
                required
              />
              <button
                type="submit"
                class="w-fit bg-black text-white font-bold px-8 py-3 rounded-xl hover:scale-105 transition-all"
              >
                Mettre à jour
              </button>
              <p id="email-msg" class="text-sm hidden"></p>
            </form>
          </div>
        </section>
        <!--Section "Modifier mon mot de passe" -->
        <section class="flex-1 w-full max-w-2xl mx-auto mt-6">
          <div
            class="bg-white rounded-3xl shadow-lg border border-gray-100 p-6 md:p-10"
          >
            <div class="flex items-center gap-4 mb-8">
              <h2
                class="text-xl md:text-2xl font-bold uppercase tracking-widest text-black"
              >
                Modifier mon mot de passe
              </h2>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <form id="password-form" class="flex flex-col gap-4">
              <input
                type="password"
                id="new-password"
                placeholder="Nouveau mot de passe (min. 8 caractères)"
                class="border border-gray-300 rounded-xl px-4 py-3 text-black focus:outline-none focus:border-black"
                required
              />
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirmer le mot de passe"
                class="border border-gray-300 rounded-xl px-4 py-3 text-black focus:outline-none focus:border-black"
                required
              />
              <button
                type="submit"
                class="w-fit bg-black text-white font-bold px-8 py-3 rounded-xl hover:scale-105 transition-all"
              >
                Mettre à jour
              </button>
              <p id="password-msg" class="text-sm hidden"></p>
            </form>
          </div>
        </section>
        <!-- SECTION SUPPRESSION      -->
        <section class="flex-1 w-full max-w-2xl mx-auto mt-10">
          <div
            class="bg-white rounded-3xl lg:rounded-4xl shadow-lg border border-gray-100 p-6 md:p-10"
          >
            <!-- Titre -->
            <div class="flex items-center gap-4 mb-8">
              <h2
                class="text-xl md:text-2xl font-bold uppercase tracking-widest text-black"
              >
                Supprimer mon compte
              </h2>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- Boutons d'action -->
            <div class="flex flex-col gap-6">
              <!-- Option 1 : conserver le contenu -->
              <a
                id="keep-content"
                href="#"
                class="w-fit border border-slate-900 rounded-2xl px-8 py-4 font-bold bg-[#E2F167]"
              >
                Garder le contenu associé ?
              </a>

              <!-- Option 2 : supprimer le contenu -->
              <a
                id="delete-content"
                href="#"
                class="w-fit border border-slate-900 rounded-2xl px-8 py-4 font-bold bg-red-400"
              >
                Supprimer le contenu associé ?
              </a>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Fichier JavaScript qui gère la logique (menu mobile, suppression, etc.) -->
    <script src="delete-account.js"></script>
  </body>
</html>
