<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Questrial&display=swap"
      rel="stylesheet"
    />
    <title>Accueil</title>
  </head>

  <body class="bg-white text-white min-h-screen font-['Questrial',sans-serif]">
    <header
      class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md border-b border-white/10 px-6 py-4"
    >
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-4">
          <button
            id="menu-btn"
            class="text-[#E2F167] text-2xl lg:hidden focus:outline-none"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <a
            href="accueil.html"
            class="text-xl md:text-2xl font-bold tracking-tighter text-[#E2F167]"
          >
            CONNECT'IN
          </a>
        </div>

        <!-- <div class="relative w-1/3 hidden lg:block">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/40"></i>
        <input type="text" placeholder="Rechercher un post..."
          class="w-full bg-white/5 border border-white/10 rounded-full py-2 pl-12 pr-4 focus:outline-none focus:border-[#E2F167]" />
      </div> -->

        <div class="flex items-center gap-4">
          <!-- <button
            id="search-trigger"
            class="text-white/80 lg:hidden focus:outline-none"
          >
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
          </button> -->

          <a
            id="userAvatar"
            href="profil.html"
            class="w-10 h-10 rounded-full bg-[#E2F167] text-slate-900 flex items-center justify-center font-bold"
          >
            JD
          </a>
        </div>
      </div>

      <div
        id="mobile-search-bar"
        class="hidden lg:hidden mt-4 relative animate-fadeIn"
      >
        <i
          class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-white/40"
        ></i>

        <input
          type="text"
          placeholder="Rechercher un post..."
          class="w-full bg-white/5 border border-white/10 rounded-full text-white py-3 pl-12 pr-4 focus:outline-none focus:border-[#E2F167] transition text-sm"
        />
      </div>
    </header>

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-8 p-4 md:p-8">
      <aside
        id="sidebar"
        class="fixed lg:sticky top-0 lg:top-28 left-0 h-full lg:h-fit w-72 lg:w-64 bg-white lg:bg-transparent z-50 lg:z-0 p-6 lg:p-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none overflow-y-auto"
      >
        <div class="flex justify-between items-center lg:hidden mb-8">
          <span class="font-bold text-xl text-black">Menu</span>
          <button id="close-btn" class="text-2xl text-black">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="flex flex-col gap-6">
          <div
            class="bg-white/5 border-none lg:border lg:border-white/10 rounded-3xl p-4 flex flex-col gap-1"
          >
            <a
              href="accueil.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-house w-6"></i> Accueil
            </a>

            <a
              href="profil.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-user w-6"></i> Profil
            </a>

            <!-- <a
              href="#"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-bell w-6"></i> Notifications
            </a> -->

            <a
              href="delete-account.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-gear w-6"></i> Gérer mon compte
            </a>

            <a
              href="#"
              id="post-btn"
              class="mt-4 bg-black text-white text-center font-bold py-3 rounded-xl hover:scale-105 transition-all"
            >
              Poster
            </a>
          </div>

          <div
            class="bg-white/5 border-none lg:border lg:border-white/10 rounded-3xl p-4 flex flex-col gap-1"
          >
            <a
              href="apropos.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-circle-info w-6"></i> À propos
            </a>

            <a
              href="contact.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-envelope w-6"></i> Contact
            </a>

            <a
              href="aide.html"
              class="sidebar-item text-black flex items-center gap-3 p-3 rounded-xl hover:bg-black/5 font-medium transition"
            >
              <i class="fa-solid fa-circle-question w-6"></i> Aide
            </a>

            <a
              href="index.html"
              class="mt-4 text-black flex items-center justify-center gap-2 rounded-xl border border-black hover:border-red-600 hover:text-red-600 py-3 font-bold transition"
            >
              <i class="fa-solid fa-power-off"></i> Déconnexion
            </a>
          </div>
        </div>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
      ></div>

      <main class="flex-1 max-w-2xl mx-auto w-full">
        <h2 class="text-xl font-bold text-black mb-6 flex items-center gap-2">
          <span class="w-2 h-2 bg-[#E2F167] rounded-full"></span>
          Posts récents
        </h2>

        <div id="postsContainer" class="space-y-6"></div>
      </main>
    </div>

    <div
      id="editModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50"
    >
      <div class="bg-white w-[90%] max-w-lg rounded-2xl p-6 relative">
        <h2 id="editModalTitle" class="text-lg font-semibold mb-4 text-black">
          Modifier
        </h2>

        <textarea
          id="editContentInput"
          class="w-full border border-slate-300 rounded-xl p-4 h-32 resize-none focus:outline-none focus:ring-2 focus:ring-black text-black"
        ></textarea>

        <div id="currentImageContainer" class="mt-3 hidden">
          <p class="text-sm text-slate-600 mb-1">Image actuelle</p>
          <img id="currentPostImage" class="rounded-xl max-h-48 object-cover" />
        </div>

        <div class="mt-4">
          <p class="text-sm font-semibold text-black mb-2">Modifier l'image</p>

          <label
            for="editImageInput"
            class="cursor-pointer inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-black px-4 py-2 rounded-lg"
          >
            <i class="fa-solid fa-image"></i>
            Choisir une image
          </label>

          <input
            type="file"
            id="editImageInput"
            accept="image/*"
            class="hidden"
          />

          <p id="editImageName" class="text-xs text-gray-500 mt-2"></p>

          <div class="flex items-center gap-2 mt-3">
            <input
              type="checkbox"
              id="removeImageCheckbox"
              class="w-4 h-4 accent-red-500"
            />

            <label
              for="removeImageCheckbox"
              class="text-sm text-red-500 font-medium"
            >
              Supprimer l'image
            </label>
          </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button
            id="cancelEditBtn"
            class="px-4 py-2 rounded-lg border border-red-600 text-red-600 hover:bg-red-50 transition"
          >
            Annuler
          </button>

          <button
            id="saveEditBtn"
            class="px-4 py-2 rounded-lg bg-black text-white hover:bg-gray-800 transition"
          >
            Enregistrer
          </button>
        </div>
      </div>
    </div>

    <script src="timeAgo.js"></script>
    <script src="post.js"></script>
    <script src="accueil.js"></script>
  </body>
</html>
